name: Update README Stat Cards

# এই একটা ফাইলই যথেষ্ট — এটা প্রতিদিন রাত ১২টায় (UTC) এবং Actions ট্যাব থেকে
# ম্যানুয়ালি Run করলে সবগুলো GitHub Stats card অটোমেটিক বানিয়ে/আপডেট করে দেবে।

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ১) উপরের সামারি কার্ড: Total Stars, Commits, PRs, Issues, Contributed to
      - name: Generate profile summary card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: rakibulislam919

      # ২) স্ট্রিক কার্ড: Total Contributions + Current Streak (আগুনের রিং) + Longest Streak
      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=rakibulislam919&theme=dark&hide_border=true&background=0D1117&ring=39FF14&fire=39FF14&currStreakLabel=39FF14
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ৩) Most Used Languages — একটা লম্বা বার + লিস্ট
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rakibulislam919&theme=dracula&hide_border=true&title_color=39FF14&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ৪) Repos/Stars/PRs/Issues দেখানো ক্লাসিক stats কার্ড
      - name: Generate general stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rakibulislam919&show_icons=true&count_private=true&include_all_commits=true&theme=dracula&hide_border=true&icon_color=39FF14&title_color=39FF14
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # সব কার্ড repo-তে কমিট করে দেওয়া হচ্ছে
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile-summary-card-output/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update README stat cards"
          git push
