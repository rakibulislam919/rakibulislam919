name: Update README Stat Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # উপরের কার্ড: Stars / Commits / PRs / Issues + GitHub লোগো রিং
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rakibulislam919&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # মাঝের কার্ড: Total Contributions + Streak রিং + Longest Streak
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=rakibulislam919&hide_border=true&background=1a1b27&ring=70a5fd&fire=70a5fd&currStreakNum=bf91f3&currStreakLabel=bf91f3&sideNums=70a5fd&sideLabels=70a5fd&dates=38bdae&stroke=ffffff
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # নিচের কার্ড: Most Used Languages (একটা বার + দুই কলামের লিস্ট)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rakibulislam919&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # উপরে-নিচের গ্রেডিয়েন্ট লাইন
      - name: Create divider
        run: |
          mkdir -p profile
          cat > profile/divider.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="3" viewBox="0 0 900 3" preserveAspectRatio="none">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#7dd3fc"/>
                <stop offset="0.5" stop-color="#ffffff"/>
                <stop offset="0.6" stop-color="#6366f1"/>
                <stop offset="1" stop-color="#7dd3fc"/>
              </linearGradient>
            </defs>
            <rect width="900" height="3" fill="url(#g)"/>
          </svg>
          EOF

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update README stat cards"
          git push
